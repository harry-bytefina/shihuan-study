se, but understanding its limitations is essential for its effective application. There are occasions where I have used the handle of a knife as a hammer(锤子), but the result would have been better if I'd had a more suitable tool at hand. As far as science goes, it is really good at testing things that are testable, but not so for those that are not.","We can do, and have done, an impressive amount with our brains. But there are limits. Sometimes these limits go away if we keep at it for long enough—we just need better facilities and experiments to get the answer. Breaking new ground in modern science this way can be costly. Next-generation supercomputers or incredibly large telescopes are expensive, yet these may be required to find answers to some of the unsolved mysteries of the universe.","Sometimes the limits we encounter in trying to unlock the nature of the universe are cognitive(认知的). Think about this: human DNA is only about 1.2 percent different from that of chimps(黑猩猩). Chimps are smart, no question. But could you teach them advanced mathematics? What if our DNA were another 1.2 percent further evolved than it is? What might our brains be capable of then? The level of abstract thinking might be unimaginable.","Sometimes the limits we hit are fundamental. There are laws of nature we may never be able to understand, however advanced our brains might become. There are experiments we might never be able to perform. We may never be able to test what caused the universe to be created, and what caused the cause of the universe being created. This is where science may never break through.","For something to be considered scientific, it must, by definition, be testable. There is a problem here: it may not need to be testable right now,but it must be testable at some point in the future by experiment. If an idea is untestable, that doesn't mean it is wrong. It means it is untestable for now. These untestable ideas also happen to be some of the most interesting ones, probably because they've puzzled humanity for centuries."],"passage_html":"\u003cp>Science serves as a powerful tool for unlocking the mysteries of the universe, but understanding its limitations is essential for its effective application. There are occasions where I have used the handle of a knife as a hammer(锤子), but the result would have been better if I&#x27;d had a more suitable tool at hand. As far as science goes, it is really good at testing things that are testable, but not so for those that are not.\u003c/p>\u003cp>We can do, and have done, an impressive amount with our brains. But there are limits. Sometimes these limits go away if we keep at it for long enough—we just need better facilities and experiments to get the answer. Breaking new ground in modern science this way can be costly. Next-generation supercomputers or incredibly large telescopes are expensive, yet these may be required to find answers to some of the unsolved mysteries of the universe.\u003c/p>\u003cp>Sometimes the limits we encounter in trying to unlock the nature of the universe are cognitive(认知的). Think about this: human DNA is only about 1.2 percent different from that of chimps(黑猩猩). Chimps are smart, no question. But could you teach them advanced mathematics? What if our DNA were another 1.2 percent further evolved than it is? What might our brains be capable of then? The level of abstract thinking might be unimaginable.\u003c/p>\u003cp>Sometimes the limits we hit are fundamental. There are laws of nature we may never be able to understand, however advanced our brains might become. There are experiments we might never be able to perform. We may never be able to test what caused the universe to be created, and what caused the cause of the universe being created. This is where science may never break through.\u003c/p>\u003cp>For something to be considered scientific, it must, by definition, be testable. There is a problem here: it may not need to be testable right now,but it must be testable at some point in the future by experiment. If an idea is untestable, that doesn&#x27;t mean it is wrong. It means it is untestable for now. These untestable ideas also happen to be some of the most interesting ones, probably because they&#x27;ve puzzled humanity for centuries.\u003c/p>","questions":[{"number":1,"prompt":"Why does the author mention “knife” and “hammer” in Paragraph 1?","options":["To demonstrate how tools can be used creatively.","To highlight consequences of using a wrong tool.","To show the necessity of keeping a handy tool within reach.","To stress the need for the right tool to achieve desired results."],"answer":"D","analysis":"写作意图题。根据第一段中“the result would have been better if I'd had a more suitable tool at hand”可知,作者在第一段中举“刀”和“锤子”的例子是为了强调需要使用恰当的工具才能达到预期的效果,故选D。"},{"number":2,"prompt":"What is often required in breaking new ground in science?","options":["Broader science education.","More advanced facilities for experiments.","Deeper understanding of the brain power.","More investment in next-generation scientists."],"answer":"B","analysis":"细节理解题。根据第二段中“we just need better facilities and experiments to get the answer”可知,在科学领域开拓创新时通常需要更好的设备和实验,故选B。"},{"number":3,"prompt":"How does the author assess human beings in terms of their cognitive capacity?","options":["They are just 2.4% away from true abstract thinking.","They are slightly smarter than other intelligent beings.","They are yet to evolve further to learn more about the universe.","They are good at solving problems with advanced mathematics."],"answer":"C","analysis":"推理判断题。根据第三段内容可知,作者假设若人类DNA再进化1.2%,其抽象思维能力可能达到无法想象的高度,以此揭示当前人类大脑的认知水平可能从根本上限制了人类对宇宙的理解。由此可推断,作者认为人类在认知能力方面还需要进一步进化,以便了解更多关于宇宙的知识,故选C。"},{"number":4,"prompt":"What message does Paragraph 4 convey?","options":["Some puzzles about the universe are way beyond scientific exploration.","Experimental research lays solid foundations for space technology.","Boundaries of science can be pushed back with determined efforts.","Limitations of science may result from insufficient testing."],"answer":"A","analysis":"主旨要义题。作者在第四段指出某些自然法则可能永远无法被理解,某些实验可能永远无法进行,以及宇宙起源相关问题可能永远无法通过科学实验验证。因此作者在第四段主要想表达的是有些关于宇宙的难题远远超出了科学探索的范畴。故选A。"},{"number":5,"prompt":"What has the author added to the definition of a scientific idea?","options":["Correct ideas are testable.","Untestable ideas can be true.","Some scientific ideas may never be testable.","An idea must be testable to be seen as correct."],"answer":"B","analysis":"主旨要义题。根据最后一段中“If an idea is untestable, that doesn't mean it is wrong. It means it is untestable for now.”以及全文内容可知,作者认为人类的认知能力仍有局限,未经证实的想法也有可能是正确的,故选B。"}],"external":{"id":"ext-132","title":"巨星陨落，风范长存：103 岁杨振宁逝世，他让世界看见中国的科学力量","blocks":[{"english":"Chen Ning Yang, Nobel-Winning Physicist, Is Dead at 103","chinese":"诺贝尔奖得主、物理学家杨振宁逝世，享年103岁"},{"english":"Chen Ning Yang, a Nobel Prize-winning theoretical physicist whose feel for mathematical aesthetics helped reveal a surprising kink in the weave of nature, died on Saturday in Beijing. He was 103.","chinese":"诺贝尔奖得主理论物理学家杨振宁于周六在北京逝世，享年103岁。他凭借对数学之美的敏锐感知，揭示了自然界运行规律中一个出人意料的“反常现象”。"},{"english":"Dr. Yang and a colleague, the physicist Tsung-Dao Lee, created a sensation in 1956 by proposing that one of the four forces of nature might violate a seemingly ironclad principle called conservation of parity — a way of saying that a phenomenon and its mirror image should behave precisely the same. Their prediction was quickly borne out by experiment, and in 1957 the two physicists were awarded perhaps the quickest Nobel Prize ever. They were the first Chinese-born laureates.","chinese":"杨振宁与同事、物理学家李政道在1956年提出了一个重磅观点：自然界四大基本力之一，可能违背“宇称守恒定律”——该定律通俗来说，即“一种物理现象与其镜像现象的运动规律应完全一致”，此前被认为是铁律。这一预测很快通过实验得到证实，1957年，这两位物理学家便荣获诺贝尔物理学奖，这或许是该奖项历史上“最快的一次颁奖”。他们是首位华裔诺贝尔奖得主。"},{"english":"The distinguished physicist Freeman Dyson, called him \"the pre-eminent stylist\" of 20th-century physics, exceeded only by Albert Einstein and Paul Dirac.","chinese":"著名物理学家弗里曼·戴森称杨振宁为“20世纪物理学界最杰出的‘风格大师’”，仅略逊于阿尔伯特·爱因斯坦与保罗·狄拉克。"},{"english":"In later years Dr. Yang became well known in China, where he helped lead the effort to promote basic research. After a visit to China in 1971, Dr. Yang began reforging old ties. In 2015, he gave up his United States citizenship to become a citizen of China.","chinese":"晚年的杨振宁在中国广为人知，他积极推动基础科学研究的发展。1971年访问中国后，杨振宁开始重建与祖国的联系。2015年，他放弃美国国籍，正式成为中国公民。"},{"english":"In the interview with Newsday, Dr. Yang doubted that physicists would ever converge on a theory of everything. \"Nature is extremely subtle,\" he said. \"I happen to think that the depth of natural substances cannot be fathomed by mankind. Because after all we only have, let's say, 100 billion neurons. How can you match that with the infinite depth of nature?\"","chinese":"在接受《新闻日报》采访时，杨振宁表示，他怀疑物理学家永远无法找到“万物理论”（即能解释所有物理现象的统一理论）。“自然界极其微妙，”他说，“我个人认为，人类无法彻底洞悉自然的深度。毕竟，我们人类的大脑只有约1000亿个神经元，凭这一点，怎么可能与无限深邃的自然相匹敌呢？”"}],"level":"7"},"notes":{"background":"外刊用「和镜像是否表现一样」解释宇称守恒，接着讲可检验的预测：某种力可能违背这个原则，实验结果支持了它。报道末尾杨振宁谈 theory of everything，怀疑的是人能否最终用一套理论解释所有基本现象。","expression":"Their prediction was quickly borne out by experiment. bear out 在这里是「证实、为……提供支持」。by 后面的 experiment 是支持预测的证据来源。","sentence":{"english":"Dr. Yang and a colleague, the physicist Tsung-Dao Lee, created a sensation in 1956 by proposing that one of the four forces of nature might violate a seemingly ironclad principle called conservation of parity — a way of saying that a phenomenon and its mirror image should behave precisely the same.","parts":["Dr. Yang and a colleague, the physicist Tsung-Dao Lee,","created a sensation in 1956","by proposing","that one of the four forces of nature might violate a seemingly ironclad principle","called conservation of parity","— a way of saying that a phenomenon and its mirror image should behave precisely the same."],"explanation":"主干是两位物理学家引起了轰动；a colleague 后的同位语说明这位同行是谁。by proposing 交代原因，that 从句提供预测内容。读到 might 先保留「可能」；下一句才报告实验结果。called … 说明这个原则的名称，破折号后解释原则本身，而非两人预测的结果。"},"vocabulary":[{"term":"aesthetics","meaning":"美学；在数学语境里，指对结构的简洁、对称之美的感受。","context":"feel for mathematical aesthetics"},{"term":"kink","meaning":"扭结、弯折；这里比喻自然规律中出乎意料的偏差。","context":"a surprising kink in the weave of nature"},{"term":"sensation","meaning":"轰动；和 create 搭配，强调一项发现引起很大反响。","context":"created a sensation in 1956"},{"term":"ironclad","meaning":"牢不可破、几乎不容置疑的；seemingly 提醒这是人们当时的看法。","context":"a seemingly ironclad principle"},{"term":"laureates","meaning":"重要奖项的获得者；这里承接上一句的诺贝尔奖。","context":"the first Chinese-born laureates"},{"term":"pre-eminent","meaning":"地位卓越、同辈中尤为突出；这里是另一位物理学家对杨振宁的评价。","context":"the pre-eminent stylist"},{"term":"converge","meaning":"汇合；converge on a theory 指从不同研究方向走向一个理论。","context":"converge on a theory of everything"},{"term":"fathomed","meaning":"彻底理解、弄明白；这里与 depth 呼应，问人类能否探明自然的深处。","context":"cannot be fathomed by mankind"}]}}],"next_source":"2024 天津高考英语第一次 · C 篇"}</script>
