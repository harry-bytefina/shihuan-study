  <script id="daily-reading-data" type="application/json">{"start_date":"2026-11-18","time_zone":"Asia/Shanghai","days":[{"id":"S-299953c881e1-P00164","date":"2026-11-18","year":2025,"session":"spring","letter":"A","source":"2025 天津高考英语第一次 · A 篇","title":"四项写作比赛，哪一项收你的稿？","passage":["Writing Competitions 2025","The Caledonia Novel Award","The award is for the best novel manuscript(原稿). All entries must be original manuscripts at least 50,000 words long by unpublished writers.","The first prize is ￡l,500. There is a special prize of a free place on a creative writing course at Moniack Mhor Centre, the sponsor of the competition.","The entry fee is ￡28. A number of sponsored places are available for writers on low incomes.","The closing date is 15 October.","Website: https://thecnaward.com/submit","The Deborah Rogers Foundation","Writers Award","The DRF Writers Award invites submissions of 15,000-20,000 words of a work in progress, which may be fiction or non-fiction.","Writers must not previously have published any work.","The winner will receive ￡10,000 and two shortlisted writers will receive ￡1,000.","The closing date is 31 May.","Website: https://www.drf.org/enter","Imagine 2100 Climate Fiction Competition","Writers are invited to “envision(展望) a future where humanity overcomes the climate crisis and builds a more sustainable world.” Your story can be set sometime between the near future and the year 2100.","Stories should be unpublished, between 2,500-5,000 words. Entry is free, with the first prize of ￡3,000.","The winning stories will be published on the competition's website.","The deadline is 24 June.","Website: https://climatefiction.org/submit","New Writers Flash Fiction Competition","New Writers is inviting entries of short fiction on any theme up to 300 words.","The first prize is ￡1,100. The winning entries will be published on the New Writers website.","All entries must be original and unpublished.","There is an entry fee of ￡10. ￡1 from each entry will be donated to First Story, the creative writing charity for young people. A limited number of free entries are available for low-income writers.","The closing date is 31 March.","Website: https://newwriters.net/compete"],"passage_html":"\u003ch2 class=\"exam-heading exam-centered\">Writing Competitions 2025\u003c/h2>\u003cdiv class=\"exam-table-wrap\" role=\"region\" aria-label=\"原题表格\" tabindex=\"0\">\u003ctable class=\"exam-table\" data-layout=\"panels\">\u003ctbody>\u003ctr>\u003ctd>\u003ch3 class=\"exam-heading exam-centered\">The Caledonia Novel Award\u003c/h3>\u003cp>The award is for the best novel manuscript(原稿). All entries must be original manuscripts at least 50,000 words long by unpublished writers.\u003c/p>\u003cp>The first prize is ￡l,500. There is a special prize of a free place on a creative writing course at Moniack Mhor Centre, the sponsor of the competition.\u003c/p>\u003cp>The entry fee is ￡28. A number of sponsored places are available for writers on low incomes.\u003c/p>\u003cp>The closing date is 15 October.\u003c/p>\u003cp>Website: https://thecnaward.com/submit\u003c/p>\u003c/td>\u003ctd>\u003ch3 class=\"exam-heading exam-centered\">The Deborah Rogers Foundation\u003c/h3>\u003ch3 class=\"exam-heading exam-centered\">Writers Award\u003c/h3>\u003cp>The DRF Writers Award invites submissions of 15,000-20,000 words of a work in progress, which may be fiction or non-fiction.\u003c/p>\u003cp>Writers must not previously have published any work.\u003c/p>\u003cp>The winner will receive ￡10,000 and two shortlisted writers will receive ￡1,000.\u003c/p>\u003cp>The closing date is 31 May.\u003c/p>\u003cp>Website: https://www.drf.org/enter\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ch3 class=\"exam-heading exam-centered\">Imagine 2100 Climate Fiction Competition\u003c/h3>\u003cp>Writers are invited to “envision(展望) a future where humanity overcomes the climate crisis and builds a more sustainable world.” Your story can be set sometime between the near future and the year 2100.\u003c/p>\u003cp>Stories should be unpublished, between 2,500-5,000 words. Entry is free, with the first prize of ￡3,000.\u003c/p>\u003cp>The winning stories will be published on the competition&#x27;s website.\u003c/p>\u003cp>The deadline is 24 June.\u003c/p>\u003cp>Website: https://climatefiction.org/submit\u003c/p>\u003c/td>\u003ctd>\u003ch3 class=\"exam-heading exam-centered\">New Writers Flash Fiction Competition\u003c/h3>\u003cp>New Writers is inviting entries of short fiction on any theme up to 300 words.\u003c/p>\u003cp>The first prize is ￡1,100. The winning entries will be published on the New Writers website.\u003c/p>\u003cp>All entries must be original and unpublished.\u003c/p>\u003cp>There is an entry fee of ￡10. ￡1 from each entry will be donated to First Story, the creative writing charity for young people. A limited number of free entries are available for low-income writers.\u003c/p>\u003cp>The closing date is 31 March.\u003c/p>\u003cp>Website: https://newwriters.net/compete\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","questions":[{"number":1,"prompt":"How many words are required for the entries to the competition sponsored by Moniack Mhor Centre?","options":["Up to 300.","2,500 to 5,000.","15,000 to 20,000.","At least 50,000."],"answer":"D","analysis":"细节理解题。根据题干关键词 words are required for the entries和Moniack Mhor Centre定位至第一个比赛信息中的“All entries must be original manuscripts at least 50,000 words long”,故选D。"},{"number":2,"prompt":"The DRF Writers Award differs from the other competitions in that _____ .","options":["it awards money prizes","it offers a free writing course","it accepts non-fiction entries","it publishes winning stories online"],"answer":"C","analysis":"细节理解题。对比四个比赛的信息,由“for the best novel manuscript”“which may be fiction or non-fiction”“envision a future”和“inviting entries of short fiction”可知,DRF Writers Award的不同之处在于它接受非虚构作品。故选C。"},{"number":3,"prompt":"Which competition involves donation to young writers?","options":["The Caledonia Novel Award.","New Writers Flash Fiction Competition.","Imagine 2100 Climate Fiction Competition.","The Deborah Rogers Foundation Writers Award."],"answer":"B","analysis":"细节理解题。根据题干关键词donation to young writers可定位至New Writers Flash Fiction Competition部分第四段的will be donated to First Story, the creative writing charity for young people,故选B。"},{"number":4,"prompt":"What do the four competitions have in common?","options":["Entries must not be previously published.","They all fund low-income writers.","All competitions are entry free.","Participants should write on particular themes."],"answer":"A","analysis":"细节理解题。根据四个比赛要求中的“original manuscripts...by unpublished writers”“must not previously have published any work”“Stories should be unpublished”和“All entries must be original and unpublished.”可知,四个比赛的共同之处在于参赛作品不得被公开发表过。故选A。"}],"external":{"id":"ext-065","title":"为了证明自己没用AI，作家们开始故意留错别字了","blocks":[{"english":"Writers Are Going to Extremes to Prove They Didn't Use AI","chinese":"为了证明自己没用 AI，作家们正走向极端"},{"english":"As a professional writer, Sarah Suzuki Harvard says she isn’t inclined toward overtly exuberant prose. But these days, she finds herself going rogue.“I’ll use aggressively casual language, like,‘hey yo, for real,’or drop a bunch of exclamation points.”","chinese":"作为一名职业作家，萨拉・铃木・哈佛（Sarah Suzuki Harvard）表示，她向来不喜欢过于华丽浮夸的文风。但如今，她却开始刻意不走寻常路。“我会用极度口语化的表达，比如‘嘿哟，说真的’，或者堆砌一堆感叹号。”"},{"english":"Like many writers, Harvard fears being accused of wielding machine-made material. She’s seen it happen to others and is proactively trying to prove her human bona fides.","chinese":"和许多作家一样，哈佛害怕被指控使用 AI 生成的内容。她亲眼见过别人遭遇这种事，因此正主动采取行动，证明自己作为人类作者的真实性。"},{"english":"Controversy over authors using AI has made regular headlines, including in March when publisher Hachette pulled the book“Shy Girl”over allegations that it was partly AI-composed. Schools and teachers have used AI-detecting software for years to catch students cutting corners, often with mixed success.","chinese":"关于作家使用 AI 的争议频频登上头条，今年 3 月就发生过一起：出版商阿歇特因被指控部分内容由 AI 撰写，下架了《羞涩女孩》/《害羞女孩》（Shy Girl ）一书。多年来，学校和老师一直在用 AI 检测软件抓投机取巧的学生，但效果始终参差不齐。"},{"english":"Andy O’Bryan, who co-founded an online group for entrepreneurs interested in AI, said he’s seen more people trying to scuff up AI-generated prose with typos or run-on sentences.","chinese":"安迪・奥布赖恩（Andy O’Bryan）联合创立了一个爱好AI 创业者的线上社群。他说，自己看到越来越多人试图用错别字、连写长句来把 AI 生成的文本 “弄糙”。"},{"english":"As AI models advance, figuring out what’s written by bots has gotten harder, said Ivan Jackson, 27, founder of the startup Writehuman. His company’s software edits AI-generated text to make it sound more human with monthly updates to capture trends.","chinese":"27 岁的伊万・杰克逊（Ivan Jackson）是初创公司 Writehuman 的创始人。他表示，随着 AI 模型不断升级，分辨哪些内容是机器人写的变得越来越难。他的公司开发的软件专门对 AI 生成文本进行润色，使其看起来更像人类手笔，并且会每月更新以捕捉最新的语言趋势。"},{"english":"Its analysis suggests current hallmarks include overreliance on phrases such as“rather than”and“essential for.”At the same time, Jackson said text rewritten by humans is increasingly flagged by AI detectors, a trend he chalks up to people unconsciously starting to copy AI’s style.","chinese":"该公司的分析显示，当前 AI 文本的典型特征包括过度使用 “而非”“至关重要” 这类短语。与此同时，杰克逊指出，人类改写的文本也越来越多地被 AI 检测工具误判为 AI 生成，他将这一趋势归因于人们已经在无意识地模仿 AI 的写作风格。"},{"english":"Ryan Johnson, 33, quit using ChatGPT last fall, worried its smooth output was eliminating what once made his blog sound distinct.“It’s like the restaurant that starts to water down the soup,”he said.“People don’t leave immediately, but eventually they’re like, eh, it doesn’t have the same kick.”","chinese":"33 岁的瑞安・约翰逊（Ryan Johnson）去年秋天停止使用 ChatGPT。他担心 AI 流畅却千篇一律的输出，正在磨灭他博客原本独特的风格。“这就像餐馆开始给汤兑水，” 他说，“人们不会立刻走掉，但最终总会觉得，嗯，这汤没原来那个味儿了。”"}],"level":"9"},"notes":{"background":"出版方撤下书、学校使用检测软件、作者担心被误判，是外刊列出的三种处境。报道用 over allegations 交代撤书涉及的指控，用 with mixed success 限定软件效果。读到这两处，不能把「有人提出指控」写成「已经证实作弊」。","expression":"pull a book over allegations 中的 pull 是「将书撤下」，over 表原因；后接 allegations that …，that 从句给出指控的内容。这种报道句式把已发生的决定与尚待核实的说法分开。","sentence":{"english":"As AI models advance, figuring out what’s written by bots has gotten harder, said Ivan Jackson, 27, founder of the startup Writehuman.","parts":["As AI models advance,","figuring out what’s written by bots","has gotten harder,","said Ivan Jackson, 27, founder of the startup Writehuman."],"explanation":"先读主干 figuring out … has gotten harder：「弄清……变得更难了」。主语是整个 -ing 短语，what’s written by bots 作 figuring out 的宾语，指「哪些文字由软件写成」。As 表示两件事随时间变化。句尾才给出说话人，founder of … 是补充身份的同位语。"},"vocabulary":[{"term":"overtly","meaning":"明显地，毫不掩饰地；这里说文风外露。","context":"overtly exuberant prose"},{"term":"exuberant","meaning":"热情奔放的；形容文字时是语气很活跃、情绪很饱满。","context":"overtly exuberant prose"},{"term":"prose","meaning":"散文体文字，与 verse 相对；此处泛指作者写的文字。","context":"AI-generated prose"},{"term":"wielding","meaning":"使用、操控；文中接材料，强调把机器写的东西拿来使用。","context":"wielding machine-made material"},{"term":"proactively","meaning":"主动采取行动，以免问题发生；作者是在被质疑之前就自证。","context":"proactively trying to prove"},{"term":"allegations","meaning":"尚待证实的指控；比 claim 更常带有涉嫌不当行为的意思。","context":"allegations that it was partly AI-composed"},{"term":"hallmarks","meaning":"醒目的典型特征；这里是观察到的文风线索，不能单凭它认定来源。","context":"current hallmarks include overreliance"},{"term":"overreliance","meaning":"过度依赖；后接 on，指出被用得过频的表达。","context":"overreliance on phrases"}]}},{"id":"S-299953c881e1-P00214","date":"2026-11-19","year":2025,"session":"spring","letter":"B","source":"2025 天津高考英语第一次 · B 篇","title":"学太极，为什么要从接受纠正开始？","passage":["I first encountered tai chi in Ottawa's Chinatown. Men and women gathered in loose formation. Their actions combined to achieve a meditative(冥想的) dance. I was amazed by its beauty and grace. It was like watching a water lily opening.","Yet I couldn't see the point. I could achieve my fitness goals from exercise classes, swimming and cycling—and moving so slowly didn't seem to build muscle, my objective for all activities. I chose only to admire this martial art(武术) but kept my distance.","Years later, a recommendation from my doctor brought me to a training group for tai chi beginners led by a caring instructor. I had thought that my goal would be to master the 108 moves. Technically right, but wrong on so many counts.","The class was full of lovely people who glided effortlessly, seemingly never confused about where to move next. They assured me that they had been beginners once too, and that I would be able to remember all the moves within three or four years. Three to four years! Graduate degrees took less time. But I could see they were right. Commit and improve: That was the only path.","Another realization came to me when I attended an advanced class. We began with foundation exercises, and almost immediately, the instructor singled me out for instruction. To be singled out was an honour, but I was mortified. All the others in the class stopped and turned to watch me while the instructor corrected my positioning. “Don't bend,” he said, and I repeated the movement. “Straighten your back,” he urged, and on it went—probably for only a few minutes, but it seemed like hours.","I couldn't say,“Yeah, I get it.” I had to show that I did. I concentrated as I had never done before, listening to what the instructor was saying, watching his movement and then willing my body to move in imitation. I was unlearning and learning, overcoming awkwardness to focus. I realized that I was learning a new way of being in the world—truly listening and open to correction.","I don't know that I will ever master the 108 moves. What I do know is that I have found an activity in my life where change and growth are not just possible but expected, even when my stubborn(固执的) personality tendencies re-emerge at every turn.","Gradually, I have become that lily unfolding, awoken not by sunlight and warmth but by this gentle martial art."],"passage_html":"\u003cp>I first encountered tai chi in Ottawa&#x27;s Chinatown. Men and women gathered in loose formation. Their actions combined to achieve a meditative(冥想的) dance. I was amazed by its beauty and grace. It was like watching a water lily opening.\u003c/p>\u003cp>Yet I couldn&#x27;t see the point. I could achieve my fitness goals from exercise classes, swimming and cycling—and moving so slowly didn&#x27;t seem to build muscle, my objective for all activities. I chose only to admire this martial art(武术) but kept my distance.\u003c/p>\u003cp>Years later, a recommendation from my doctor brought me to a training group for tai chi beginners led by a caring instructor. I had thought that my goal would be to master the 108 moves. Technically right, but wrong on so many counts.\u003c/p>\u003cp>The class was full of lovely people who glided effortlessly, seemingly never confused about where to move next. They assured me that they had been beginners once too, and that I would be able to remember all the moves within three or four years. Three to four years! Graduate degrees took less time. But I could see they were right. Commit and improve: That was the only path.\u003c/p>\u003cp>Another realization came to me when I attended an advanced class. We began with foundation exercises, and almost immediately, the instructor singled me out for instruction. To be singled out was an honour, but I was \u003cu>mortified\u003c/u>. All the others in the class stopped and turned to watch me while the instructor corrected my positioning. “Don&#x27;t bend,” he said, and I repeated the movement. “Straighten your back,” he urged, and on it went—probably for only a few minutes, but it seemed like hours.\u003c/p>\u003cp>I couldn&#x27;t say,“Yeah, I get it.” I had to show that I did. I concentrated as I had never done before, listening to what the instructor was saying, watching his movement and then willing my body to move in imitation. I was unlearning and learning, overcoming awkwardness to focus. I realized that I was learning a new way of being in the world—truly listening and open to correction.\u003c/p>\u003cp>I don&#x27;t know that I will ever master the 108 moves. What I do know is that I have found an activity in my life where change and growth are not just possible but expected, even when my stubborn(固执的) personality tendencies re-emerge at every turn.\u003c/p>\u003cp>Gradually, I have become that lily unfolding, awoken not by sunlight and warmth but by this gentle martial art.\u003c/p>","questions":[{"number":1,"prompt":"What was the author's first impression of tai chi?","options":["Pleasant to the eye but not of much use.","Too slow to be regarded as a martial art.","Helpful in accomplishing fitness goals.","Mysterious and difficult to master."],"answer":"A","analysis":"细节理解题。根据前两段中amazed by its beauty and grace和didn't seem to build muscle, my objective for all activities可知,作者认为太极拳赏心悦目,但是没有太多用处,达不到健身长肌肉的目标。故选A。"},{"number":2,"prompt":"In the beginners' class, the author realized that mastering tai chi required _____ .","options":["discipline","leadership","persistence","teamwork"],"answer":"C","analysis":"推理判断题。根据第三段和第四段中的to master the 108 moves和“to remember all the moves within three or four years. Three to four years! Graduate degrees took less time.”可推知,学习太极拳是一件长时间的事情,需要坚持不懈(persistence)。故选C。"},{"number":3,"prompt":"What does the underlined word “mortified” in Paragraph 5 probably mean?","options":["Angered.","Confused.","Disappointed.","Embarrassed."],"answer":"D","analysis":"推测词义题。由“To be singled out was an honour, but I was mortified.”可知,作者虽觉得被单独指导是一种荣幸,但紧接着用but转折,说明实际感受与“荣幸”相反。再根据“All the others in the class stopped and turned to watch me”以及第六段中的awkwardness可推知,作者被教练单独指导,成为众人焦点,会感到尴尬、难堪。故选D。"},{"number":4,"prompt":"How did the author respond to the instructions in the advanced class?","options":["She denied her weaknesses and carried on.","She stayed focused and followed attentively.","She worked hard and displayed her talent.","She opened up her mind and sought advice."],"answer":"B","analysis":"细节理解题。根据第六段中“I concentrated as I had never done before”以及truly listening and open to correction可知,作者聚精会神地聆听教练的指令,改进自己的动作。故选B。"},{"number":5,"prompt":"Which of the following can be concluded from the author's experience?","options":["Tai chi empowers people to improve.","Tai chi keeps the balance of the body.","Tai chi fires people's passion for sports.","Tai chi facilitates healthy relationships."],"answer":"A","analysis":"主旨要义题。根据第六段中的“I realized that I was learning a new way of being in the world”以及第七段中的“change and growth are not just possible but expected”可知,作者在练习太极拳的过程中,身心得到提升,实现了自我蜕变和成长。故选A。"}],"external":{"id":"ext-210","title":"精选｜“当我爱上观鸟，生活慢慢有了秩序”","blocks":[{"english":"When I Became a Birder, Almost Everything Else Fell Into Place","chinese":"观鸟始，万象皆安"},{"english":"Last September, I drove to a protected wetland near my home in Oakland, Calif., walked to the end of a pier and started looking at birds. Since then, my birder derangement syndrome has progressed at an alarming pace. I've seen 452 species, including 307 this year alone.","chinese":"去年9月，我驱车来到加州奥克兰的一片受保护湿地，就位于我家附近。我走到长堤尽头，开始观鸟。从那时起，我的“观鸟狂热综合症”便以惊人的速度发展——至今我已观测到452种鸟类，其中仅今年就有307种。"},{"english":"Birding has proved more meditative than meditation. While birding, I seem impervious to heat, cold, hunger and thirst. My senses focus resolutely on the present, and the usual hubbub in my head becomes quiet. When I spot a species for the first time—a lifer—I course with adrenaline while being utterly serene.","chinese":"观鸟的体验已被证明比冥想本身更具禅意。在观鸟时，我似乎对炎热、寒冷、饥饿和口渴都无动于衷。我的感官彻底专注于当下，我脑中经常出现的喧闹也变得安静下来。当我第一次发现了某个鸟类新品种——也就是观鸟者所称的“人生新鸟种”——我开始分泌肾上腺素，兴奋地追踪这只鸟，同时内心无比宁静。"},{"english":"I also feel a much deeper connection to the natural world. The passing of the seasons feels more granular, marked by the arrival and disappearance of particular species instead of much slower changes in day length, temperature and greenery. I find myself noticing small shifts in the weather and small differences in habitat. I think about the tides.","chinese":"我也感觉自己与自然世界的联系更加紧密。季节的更迭变得更加具体可感：不再仅凭昼长、温度和草木颜色的缓慢变化来感知，而是由特定鸟类的到来与离去来界定。我发现自己开始注意到天气的微小转变和栖息地的细微改变。这让我想到了潮汐。"},{"english":"So much more of the natural world feels close and accessible now. When I started birding, I remember thinking that I'd never see most of the species in my field guide. I had internalized the idea of nature as distant and remote — the province of nature documentaries and far-flung vacations. But in the past six months, I've seen soaring golden eagles and marveled at diving Pacific loons, all within an hour of my house.","chinese":"自然世界中越来越多的事物变得近在咫尺、触手可及。记得我刚开始观鸟时，我认为野外图鉴里的大多数鸟类品种都是不可能见到的。大自然遥不可及的印象已经在我心中扎根——它只属于自然纪录片和长途跋涉的假期。但是在过去六个月里，我看到了翱翔的金雕，也惊叹于太平洋潜鸟的潜水技艺，而这一切都发生在离我家不到一小时车程的地方。"},{"english":"It's easy to think of birding as an escape from reality. Instead, I see it as immersion in the true reality. I don't need to know who the main characters are on social media and what everyone is saying about them, when I can instead spend an hour trying to find a rare sparrow. It's very clear to me which of those two activities is the more ridiculous. It's not the one with the sparrow.","chinese":"人们通常会认为，观鸟是逃避现实。恰恰相反，我认为它是对真实世界的深度沉浸。我不需要知道社交媒体上的主角是谁，也不需要知道人们在如何讨论他们，因为我可以花同样的一小时来试着寻找一只罕见的麻雀。我很清楚，这两种活动中哪一种更荒谬。肯定不是和麻雀一起的那个。"}]},"notes":{"background":"观鸟者把自己第一次亲眼看到的某个鸟种叫作 a lifer。文中用破折号补上这个圈内称呼；它解释了为什么人一边安静地看，一边又会因为认出新鸟种而兴奋。","expression":"internalize the idea of A as B：一种看法在心里变成了默认判断。文中的 as distant and remote 接在 nature 后，说明作者曾把自然想成遥远的地方；随后列出的金雕和潜鸟，是对这种想法的现场反证。","sentence":{"english":"The passing of the seasons feels more granular, marked by the arrival and disappearance of particular species instead of much slower changes in day length, temperature and greenery.","parts":["The passing of the seasons","feels more granular,","marked by the arrival and disappearance of particular species","instead of much slower changes in day length, temperature and greenery."],"explanation":"主语是 The passing of the seasons，feels 是系动词，more granular 作表语。逗号后 marked by 补充说明季节变化如今靠什么辨认。instead of 把两种标志放在一起比：某个鸟种的来去更具体；日长、气温和植被的改变更缓慢。granular 在这里说的是作者感觉分得更细。"},"vocabulary":[{"term":"meditative","meaning":"有冥想般专注感的；此处形容具体活动带来的平静。","context":"Birding has proved more meditative than meditation."},{"term":"impervious","meaning":"不受……影响的；常接 to。这里说观鸟时几乎顾不上冷热和饥渴。","context":"impervious to heat, cold, hunger and thirst"},{"term":"resolutely","meaning":"坚定地、很专注地；这里强调感官牢牢集中在当下。","context":"focus resolutely on the present"},{"term":"hubbub","meaning":"喧闹声；用在 in my head 中，写脑子里平时纷乱的念头。","context":"the usual hubbub in my head"},{"term":"serene","meaning":"安详平静的；外表和注意力都静，即使身体很兴奋。","context":"while being utterly serene"},{"term":"granular","meaning":"细到能分辨更小差别的；此处指对季节变化的感知更有层次。","context":"The passing of the seasons feels more granular"},{"term":"internalized","meaning":"把一种看法内化为自己的默认认识。","context":"internalized the idea of nature as distant and remote"},{"term":"immersion","meaning":"全身心投入、沉浸；常接 in。","context":"immersion in the true reality"}]}},{"id":"S-299953c881e1-P00247","date":"2026-11-20","year":2025,"session":"spring","letter":"C","source":"2025 天津高考英语第一次 · C 篇","title":"闻到的味道，真只靠鼻子吗？","passage":["There is something about wine experts that annoys people. Wine tasting has become the best example of a privileged group who spend their days nose deep in a glass of fine wine. This negative view of wine experts isn't only misguided, but part of a general devaluation(贬低) of our sense of smell.","Humans are, in fact, sensitive smellers. A decade ago, researchers discovered that humans can often detect odours(气味) at a weaker concentration than animals can, outperforming most other animals except dogs. Ethyl mercaptan, a chemical added to natural gas so we can detect leaks, requires the amount equal to just three drops in a space the size of an Olympic swimming pool for us to detect it.","It is true that our sense of smell is different from our other senses. While our brains are superb at performing visual analyses, the human sense of smell creates overall impressions of our surroundings, informed by all our senses. When we perceive a smell, we interpret it based also on what we see, hear, think and feel. For example, hunger or the bodily memory of an illness might create opposite reactions to the same food smell.","These cross-sensory(跨感官的) influences on our smell perceptions might seem like a shortcoming, but it is rather a feature, not a problem. The brain is especially engaged in making predictions about future smells, and when those predictions are violated by a surprising smell, several regions across the brain respond in an effort to re-evaluate what we are actually smelling.","Wine experts are great at making smell predictions. A pale ruby-red colour might guide the expert to smell out apple or strawberry in a fine wine. The sense of smell evolved in natural environments where the senses had to work together to find potential food sources and remember the consequences of eating them. The competence of wine tasters is fuelled by their knowledge of sensory correspondences.","Smells link together impressions from all the senses, connecting them to our internal states: hunger, emotions, memories and expectations. That is why the loss of the ability to smell often leaves people depressed with a bad appetite and a lack of enjoyment from eating and drinking.","Smelling makes us live our life more vividly. Spending more time among the smells of nature is an excellent way to increase our nasal(鼻子的) intelligence."],"passage_html":"\u003cp>There is something about wine experts that annoys people. Wine tasting has become the best example of a privileged group who spend their days nose deep in a glass of fine wine. This negative view of wine experts isn&#x27;t only misguided, but part of a general devaluation(贬低) of our sense of smell.\u003c/p>\u003cp>Humans are, in fact, sensitive smellers. A decade ago, researchers discovered that humans can often detect odours(气味) at a weaker concentration than animals can, outperforming most other animals except dogs. Ethyl mercaptan, a chemical added to natural gas so we can detect leaks, requires the amount equal to just three drops in a space the size of an Olympic swimming pool for us to detect it.\u003c/p>\u003cp>It is true that our sense of smell is different from our other senses. While our brains are superb at performing visual analyses, the human sense of smell creates overall impressions of our surroundings, informed by all our senses. When we perceive a smell, we interpret it based also on what we see, hear, think and feel. For example, hunger or the bodily memory of an illness might create opposite reactions to the same food smell.\u003c/p>\u003cp>These cross-sensory(跨感官的) influences on our smell perceptions might seem like a shortcoming, but it is rather a feature, not a problem. The brain is especially engaged in making predictions about future smells, and when those predictions are violated by a surprising smell, several regions across the brain respond in an effort to re-evaluate what we are actually smelling.\u003c/p>\u003cp>Wine experts are great at making smell predictions. A pale ruby-red colour might guide the expert to smell out apple or strawberry in a fine wine. The sense of smell evolved in natural environments where the senses had to work together to find potential food sources and remember the consequences of eating them. The competence of wine tasters is fuelled by their knowledge of sensory correspondences.\u003c/p>\u003cp>Smells link together impressions from all the senses, connecting them to our internal states: hunger, emotions, memories and expectations. That is why the loss of the ability to smell often leaves people depressed with a bad appetite and a lack of enjoyment from eating and drinking.\u003c/p>\u003cp>Smelling makes us live our life more vividly. Spending more time among the smells of nature is an excellent way to increase our nasal(鼻子的) intelligence.\u003c/p>","questions":[{"number":1,"prompt":"What is the author's purpose of mentioning wine experts in Paragraph 1?","options":["To present a misunderstanding.","To support a commonly held view.","To share a personal experience.","To criticize a certain group of people."],"answer":"A","analysis":"写作意图题。根据第一段最后一句话“This negative view of wine experts isn't only misguided, but part of a general devaluation(贬低) of our sense of smell.(这种对品酒专家的负面看法不仅不正确,而且也是对我们的嗅觉能力普遍贬低的一部分)”可知,作者在第一段中提及品酒专家的意图是指出一种误解。故选A。"},{"number":2,"prompt":"What did researchers find about the human sense of smell a decade ago?","options":["Humans are very sensitive to natural gas.","Humans can smell extremely weak odours.","Humans excel in identifying chemicals in the air.","Humans do worse in detecting smells than animals."],"answer":"B","analysis":"细节理解题。根据第二段内容可知,人类往往能够比动物更容易察觉到浓度较低的气味且仅需在相当于一个奥运会游泳池大小的空间中添加三滴乙硫醇,人类就能察觉到其存在。由此可知,人类能够察觉极其微弱的气味。故选B。"},{"number":3,"prompt":"What can be inferred from Paragraph 3?","options":["Overusing the sense of smell may weaken other senses.","Hunger has little connection with the sense of smell.","The colour of food may help bring out its smell.","Sharpening the senses boosts memory capacity."],"answer":"C","analysis":"推理判断题。第三段讲述了人类的嗅觉之所以有别于其他感官,是因为人类在甄别气味时,大脑会同时借助于所看、所听、所想、所感对气味进行解读,做出判断。由此可推断,C项(食物的颜色或许有助于体现其气味)正确。"},{"number":4,"prompt":"When predicting a smell, the brain may make a re-evaluation if _____ .","options":["an unpleasant smell is quickly detected","cross-sensory influences are maximized","the sense of smell is frequently disturbed","the perceived smell goes against the expectation"],"answer":"D","analysis":"细节理解题。根据第四段中“when those predictions are violated by a surprising smell...re-evaluate what we are actually smelling”可知,如果所感知到的气味与预期不符时,大脑会重新进行评估。故选D。"},{"number":5,"prompt":"According to Paragraph 5, the evolution of the sense of smell has much to do with _____ .","options":["easy access to food sources","human curiosity about nature","sensory knowledge about food","dangers in natural environments"],"answer":"C","analysis":"推理判断题。根据第五段内容可知,嗅觉在自然环境中进化,而在大自然中各种感官需要协作寻找食物并记忆进食结果。由此可推知,嗅觉的进化与对食物的感官认知有着密切的关系。故选C。"},{"number":6,"prompt":"What does the passage focus on?","options":["How the sense of smell assists the working of other senses.","How the sense of smell functions by involving other senses.","How all the senses operate together to bring us a vivid world.","How we can train ourselves to be sensitive smellers."],"answer":"B","analysis":"主旨要义题。文章主要描述了人类嗅觉的进化过程,解释了嗅觉与其他感官协同合作并发挥作用的机制。故选B。"}],"external":{"id":"ext-219","title":"南瓜香料拿铁，为什么让欧洲人意见不一？","blocks":[{"english":"'You Love It or You Hate It': Pumpkin Spice Lattes Divide Europe","chinese":"“爱的爱死，恨的恨死”：南瓜香料拿铁正在分裂欧洲"},{"english":"'You Love It or You Hate It': Pumpkin Spice Lattes Divide Europe","chinese":"“爱的爱死，恨的恨死”：南瓜香料拿铁正在分裂欧洲"},{"english":"As soon as autumn weather arrives, customers at Have a Roll bakeries in Belgium begin to ask the baristas: Is it pumpkin spice latte season yet?","chinese":"每到秋意刚起，比利时“Have a Roll”面包店的顾客就迫不及待地问咖啡师：南瓜香料拿铁上了吗？"},{"english":"\"It's getting more popular every year,\" said Dennis Van Peel, the chain's owner, who puts the drink on the menu at his cafes in Antwerp, Brussels and other cities starting in October. He has begun to serve the beverage by request even earlier.","chinese":"“它一年比一年受欢迎，”这家连锁品牌的老板丹尼斯·范·皮尔（Dennis Van Peel）说道。他家位于安特卫普、布鲁塞尔等其他城市的咖啡馆，通常在10月陆续推出南瓜拿铁。如今，只要有顾客来询问，他就会提早供应。"},{"english":"But, he admits, \"either you love it or you hate it.\"","chinese":"不过他也笑着承认，“这款饮品，要么爱得上头，要么讨厌得要命。”"},{"english":"Since pumpkin spice lattes were first added to Starbucks's American menus in 2003, they have become a fall mainstay in the United States, where versions are regularly sold in smaller independent coffee shops.","chinese":"自从星巴克在2003年把南瓜香料拿铁加入美国区的菜单，它在全美就成了“秋天标配”。后来，小众独立咖啡馆也纷纷卖起了改良款。"},{"english":"Yet in Europe, the birthplace of the espresso, where coffee culture stretches back nearly a half-millennium and American culinary creations are viewed with frequent suspicion and occasional contempt, the flavored lattes are divisive.","chinese":"但在欧洲，这款风味拿铁却颇具争议。欧洲是浓缩咖啡的发源地，咖啡文化延续了近五百年，对于那些美式创意餐饮，欧洲人常常有点怀疑，偶尔还会嫌弃。"},{"english":"Contrary to common perception, the drinks often contain no pumpkin. What is essential is a signature mix of spices that is typically found in pumpkin pie, including cinnamon, nutmeg, ginger and allspice.","chinese":"并且和大众以为的不同，南瓜香料拿铁里通常没有南瓜。风味的关键其实是用来制作南瓜派的标志性香料——由肉桂、肉豆蔻、生姜、丁香混合而成的经典配方。"},{"english":"Such a mix first became associated with autumn in 16th- and 17th-century Europe, food experts say. \"You start to get these spiced foods—like fruit cake, gingerbread—associated with the fall and holiday season,\" said Sarah Wassberg Johnson, a food historian who runs a blog on culinary history.","chinese":"美食史学家说，早在16、17世纪，人们就把这种香料组合跟秋天联系在一起了。“像水果蛋糕、姜汁饼干这类‘加香料’的点心，就是从那时起和秋天还有节庆挂钩的。”研究饮食文化历史并运营着相关博客的莎拉·瓦斯伯格·约翰逊（Sarah Wassberg Johnson）说道。"},{"english":"Starbucks, based in Seattle, mixed those spices with coffee and milk for a mass audience, and the rest is latte history.","chinese":"之后，位于西雅图的星巴克将这些香料与咖啡、牛奶调在一起，并推广给大众，自此就写下了“拿铁界的新篇章”。"}],"level":"9"},"notes":{"background":"报道说 pumpkin spice 是常用于南瓜派的一组香料，比如肉桂、肉豆蔻、姜和多香果。这里的名称沿用甜点的调味传统，不能拿来判断每一杯饮品的配料。allspice 是一种具体香料，译作「多香果」，不是这几种香料的总称。","expression":"Contrary to common perception 先交代大众通常怎么想，下句再给出与此相反的信息。注意原文的 often：它修饰 contain no pumpkin。可以据此说「不少这类拿铁不含南瓜」，不能改成「这种拿铁一概没有南瓜」。","sentence":{"english":"Yet in Europe, the birthplace of the espresso, where coffee culture stretches back nearly a half-millennium and American culinary creations are viewed with frequent suspicion and occasional contempt, the flavored lattes are divisive.","parts":["Yet in Europe,","the birthplace of the espresso,","where coffee culture stretches back nearly a half-millennium","and American culinary creations are viewed with frequent suspicion and occasional contempt,","the flavored lattes are divisive."],"explanation":"主句等到最后才出现：the flavored lattes are divisive，意思是这种调味拿铁让人意见不一。the birthplace of the espresso 是对 Europe 的同位补充；where 也回指 Europe，后面 and 并列的是欧洲咖啡文化的来历和一些人对美国新饮食的态度。这两句都还在 where 从句内。"},"vocabulary":[{"term":"baristas","meaning":"咖啡师；通常指在咖啡店冲调和供应咖啡的人。","context":"ask the baristas"},{"term":"beverage","meaning":"饮品；比 drink 更常见于餐饮报道或菜单分类。","context":"serve the beverage by request"},{"term":"mainstay","meaning":"长期占重要位置的东西；a fall mainstay 在文中指每到秋天常见的固定款。","context":"a fall mainstay"},{"term":"culinary","meaning":"与烹饪、饮食有关的；这里形容饮食领域的新创意。","context":"American culinary creations"},{"term":"contempt","meaning":"轻蔑、瞧不起；with contempt 表示带着轻蔑，语气比 suspicion 重。","context":"occasional contempt"},{"term":"divisive","meaning":"容易让人意见对立的；形容饮品时指有人很爱，也有人很不喜欢。","context":"the flavored lattes are divisive"},{"term":"perception","meaning":"认识或看法；common perception 是普遍以为的情况，这里不指生理上的感知。","context":"Contrary to common perception"},{"term":"signature","meaning":"有辨识度、能代表某种风味的；这里作定语，不能译成「签名」。","context":"a signature mix of spices"}]}},{"id":"S-299953c881e1-P00290","date":"2026-11-21","year":2025,"session":"spring","letter":"D","source":"2025 天津高考英语第一次 · D 篇","title":"同样拿过奥斯卡，先后顺序重要吗？","passage":["Ask most people what “the good life” involves, and they will likely draw up a rapid list of goods—money, friendship, a rewarding career, etc. Even Aristotle, who believed that the key to happiness is the cultivation(培养) and exercise of virtue, still thought certain goods were either necessary conditions for happiness or were goods that came to virtuous people.","If we're comparing how happy various people's lives are, it seems natural to look for certain goods, and compare who has more of them. Let's imagine the lives of two actors, Toby and Ybot. Toby struggles to get work for many years, suffering all sorts of difficulties. He becomes a famous and wealthy actor, and wins an Oscar for his final movie before retiring. Ybot, however, wins an Oscar for his very first film role. But over time he becomes less famous and less well paid, and he begins to suffer difficulties. In the end, he retires as a nobody.","These two actors' lives, like their names, are mirror-images. Toby and Ybot both seem to lead lives of equal net worth. Yet most of us would think that the ordering of these goods does make a decisive difference to how we compare Toby and Ybot's careers. Someone who climbs a mountain will experience more struggle than someone who gets carried to the peak by bus, but the climber will also have a sense of accomplishment the other person may well envy. In that sense, we might think Toby's life is better because his highs seem more well-earned than Ybot's do.","But that's not the whole story. The narrative(叙述) itself seems to make a difference. A life of early success followed by decline seems like a less overall successful life than one where success comes later in the day. Where the story ends seems to matter in itself. We value happy endings, not just happy moments.","This immediate judgment finds expression in what's been called the “shape of life” hypothesis(假说). On this view, living a good life is not simply about having the right kind of experiences or life-events, but of having them in the right order. The hypothesis suggests that our lives are not simply bags into which we stuff good things and bad things. The type of life—the narrative of that life-story—matters too. Without the right shape, even a life full of wondrous things can end up as a tale we'd prefer not to live out."],"passage_html":"\u003cp>Ask most people what “the good life” involves, and they will likely draw up a rapid list of goods—money, friendship, a rewarding career, etc. Even Aristotle, who believed that the key to happiness is the cultivation(培养) and exercise of virtue, still thought certain goods were either necessary conditions for happiness or were goods that came to virtuous people.\u003c/p>\u003cp>If we&#x27;re comparing how happy various people&#x27;s lives are, it seems natural to look for certain goods, and compare who has more of them. Let&#x27;s imagine the lives of two actors, Toby and Ybot. Toby struggles to get work for many years, suffering all sorts of difficulties. He becomes a famous and wealthy actor, and wins an Oscar for his final movie before retiring. Ybot, however, wins an Oscar for his very first film role. But over time he becomes less famous and less well paid, and he begins to suffer difficulties. In the end, he retires as a nobody.\u003c/p>\u003cp>These two actors&#x27; lives, like their names, are mirror-images. Toby and Ybot both seem to lead lives of equal net worth. Yet most of us would think that the ordering of these goods does make a decisive difference to how we compare Toby and Ybot&#x27;s careers. Someone who climbs a mountain will experience more struggle than someone who gets carried to the peak by bus, but the climber will also have a sense of accomplishment the other person may well envy. In that sense, we might think Toby&#x27;s life is better because his highs seem more well-earned than Ybot&#x27;s do.\u003c/p>\u003cp>But that&#x27;s not the whole story. The narrative(叙述) itself seems to make a difference. A life of early success followed by decline seems like a less overall successful life than one where success comes later in the day. Where the story ends seems to matter in itself. We value happy endings, not just happy moments.\u003c/p>\u003cp>This immediate judgment finds expression in what&#x27;s been called the “shape of life” hypothesis(假说). On this view, living a good life is not simply about having the right kind of experiences or life-events, but of having them in the right order. The hypothesis suggests that our lives are not simply bags into which we stuff good things and bad things. The type of life—the narrative of that life-story—matters too. Without the right shape, even a life full of wondrous things can end up as a tale we&#x27;d prefer not to live out.\u003c/p>","questions":[{"number":1,"prompt":"What can be learned about Aristotle's view on happiness?","options":["Goods contribute to happiness.","Virtuous people may not be happy.","Too many goods reduce happiness.","Happy people care less about goods."],"answer":"A","analysis":"细节理解题。根据第一段中“Even Aristotle, who believed...certain goods were either  necessary conditions for happiness or were goods that came to virtuous people.”可知,亚里士多德认为某些事物是幸福的必要条件。故选A。"},{"number":2,"prompt":"According to the author, what do both Toby and Ybot experience?","options":["They start from a humble beginning.","They reach the same height in career.","They recover from the same sufferings.","They retire with honour from the film industry."],"answer":"B","analysis":"细节理解题。根据第二段中“Toby...wins an Oscar for his final movie before retiring.”和“Ybot, however, wins an Oscar for his very first film role.”可知,两个人都获得了奥斯卡奖,故选B(他们在职业生涯中达到了相同的高度)。"},{"number":3,"prompt":"What does the author try to convey with the example of mountain climbing?","options":["Easy success is often envied.","There are various paths to success.","Fierce struggle is vital to success.","Hard-earned success is treasured more."],"answer":"D","analysis":"写作意图题。根据第三段中“most of us would think that the ordering of these goods does make a decisive difference”以及“Toby's life is better because his highs  seem more well-earned than Ybot's do”可知,作者借助登山的例子来表达人们会觉得来之不易的成功更弥足珍贵。故选D。"},{"number":4,"prompt":"In writing Paragraph 4, the author tries to _____ .","options":["introduce another topic","draw a conclusion","further an argument","provide new evidence"],"answer":"C","analysis":"语篇结构题。第三段最后一句话提到人们或许会觉得托比的人生更有价值,因为他的成功来之不易,而第四段第一句(But that's not the whole story.)表示事情并非仅此而已,进而指出叙述本身也会影响整体评价,本质是在原有观点的基础上补充新的内容。故选C。"},{"number":5,"prompt":"What could be the best title for the passage?","options":["To Shape Your Life with Good Deeds.","Defining the Shape of a Good Life.","The Essential Components of Good Life.","How We Can Have a Good Shape of Life."],"answer":"B","analysis":"主旨要义题。文章最后一段引出并阐释“shape of life” hypothesis,强调美好生活并非简单拥有恰当的经历或人生事件,而在于以对的顺序拥有它们,探讨了美好人生的定义方式。故选B。"}],"external":{"id":"ext-197","title":"夺冠之后，快乐能持续多久？","blocks":[{"english":"Most of us are bad at predicting what will make us happy, including the world's best athletes","chinese":"我们大多数人都不擅长预测什么会让自己幸福，哪怕是世界上最优秀的运动员也一样。"},{"english":"Four years ago, on a mountainside in Beijing, Mathilde Gremaud, a freestyle skier from Switzerland, did something that should have made her happy. Competing in just her second Olympics, at the age of 22, she won a gold medal.","chinese":"四年前，在北京的一处山坡上，来自瑞士的自由式滑雪运动员玛蒂尔德·格雷莫德（Mathilde Gremaud）做了一件按理说足以让她感到幸福的事。那是她第二次参加奥运会，年仅22岁的格雷莫德便夺得了一枚金牌。"},{"english":"It was the kind of watershed moment many athletes dream about. Gremaud edged rival Eileen Gu in the slopestyle final by a fraction of a point. She stood atop the podium, clutched her medal and lifted a bouquet of flowers in the air. A month later, the joy was gone.","chinese":"那是许多运动员梦寐以求的决定性时刻。在坡面障碍技巧决赛中，格雷莫德以微弱优势击败对手谷爱凌（Eileen Gu）。她站在最高领奖台上，紧握奖牌，高高举起鲜花。而一个月后，喜悦消失了。"},{"english":"Every two years, the Olympics offer a fascinating petri dish in which to explore happiness. And yet in the past 40 years, researchers have found that a large swath of Olympians suffer from a phenomenon called the post-Olympic blues — an emotional crash following the event.","chinese":"每隔两年，奥运会都为我们提供一个迷人的“培养皿”，让我们得以探索幸福这回事。而在过去40年里，研究发现相当一部分奥运选手都会经历一种被称为“奥运后抑郁”的现象——即赛事结束后的情绪崩塌。"},{"english":"For decades, social psychologists and scientists have tried to figure out the why. It starts with one idea: People are really bad at predicting what will make them happy.","chinese":"数十年来，社会心理学家和科学家一直试图找出其中的原因。发现一切都始于这一点：人们实在不擅长预测什么会让自己快乐。"},{"english":"One of the primary reasons people are bad at forecasting their emotions is something called \"focalism,\" a cognitive bias in which people tend to narrowly focus their attention on big events while ignoring all the smaller aspects of their lives.","chinese":"人们之所以不善于情绪预测，主要原因之一是所谓的“焦点效应”（focalism），这是一种认知偏差，人们倾向于把注意力局限地集中在重大事件上，而忽略生活中所有细微的部分。"},{"english":"When we think about what would make us happy, we tend to think of intense events. But how good your experiences are doesn't matter nearly as much as how many good experiences you have. The secrets to happiness are really not so secret: Volunteer, focus on social connections, express gratitude, embrace the journey. Then keep doing those things a lot. Happiness is the sum of hundreds of small things.","chinese":"当设想什么会让自己幸福时，我们往往想到的是那些强烈的大事件。但决定幸福感的，与其说是某段经历有多么美好，不如说是你拥有多少美好的经历。幸福的秘诀其实并不神秘：去帮助别人，珍视社会联结，表达感恩，拥抱旅程。然后，把这些事一直做下去。幸福，是无数个微小瞬间的总和。"}]},"notes":{"background":"报道把注意力过度集中在一件大事上、忽略日常其他因素的倾向称为 focalism。用它解释对赛后情绪的预测偏差，并不意味着每位获奖运动员都会经历情绪低落。报道说的是部分人的变化及研究者给出的一种解释。","expression":"should have made her happy 在开头表示按常理本该让她开心，为后文的落差作铺垫；不能据此说她当时没感到快乐。第三段的 A month later 才交代一个月后喜悦已经消退。","sentence":{"english":"One of the primary reasons people are bad at forecasting their emotions is something called \"focalism,\" a cognitive bias in which people tend to narrowly focus their attention on big events while ignoring all the smaller aspects of their lives.","parts":["One of the primary reasons people are bad at forecasting their emotions","is something called \"focalism,\"","a cognitive bias","in which people tend to narrowly focus their attention on big events","while ignoring all the smaller aspects of their lives."],"explanation":"主干是 One of the primary reasons … is something …，中心词是 One，故用 is。people are bad at … 限定 reasons，可以补回 why。a cognitive bias 紧接术语给出它的类别，in which 再定义这个偏差的具体表现；while ignoring 与前面的 focus 对照，主语仍是 people。"},"vocabulary":[{"term":"watershed","meaning":"分水岭、重要转折；在这里修饰 moment，常用来写职业生涯中的关口。","context":"the kind of watershed moment many athletes dream about"},{"term":"podium","meaning":"领奖台；在体育报道中，站上领奖台通常意味着拿到名次。","context":"stood atop the podium"},{"term":"clutched","meaning":"紧紧攥住；比 held 更强调手握得紧。","context":"clutched her medal"},{"term":"bouquet","meaning":"扎成一束的花；a bouquet of flowers 侧重花束这一整体。","context":"lifted a bouquet of flowers in the air"},{"term":"swath","meaning":"一大片；a large swath of 在这里转指群体里相当大的一部分。","context":"a large swath of Olympians"},{"term":"forecasting","meaning":"预测；常用于天气、经济等，这里宾语换成了未来会有的情绪。","context":"forecasting their emotions"},{"term":"focalism","meaning":"过度聚焦；在预测感受时高估一件突出事件的作用，遗漏其他因素。","context":"something called \"focalism,\" a cognitive bias"},{"term":"gratitude","meaning":"感激、谢意；可搭配 express，强调把谢意表达出来。","context":"express gratitude"}]}},{"id":"S-299953c881e1-P00004","date":"2026-11-22","year":2025,"session":"summer","letter":"A","source":"2025 天津高考英语第二次 · A 篇","title":"植物园的参观规则保护什么？","passage":["Welcome to our university's Botanic Garden—plan your visit, and find out about what we do!","You can either pay at the Ticket Office on arrival, or book your tickets online. Please note: Tickets cannot be used on any date other than the one they were booked for and are non-refundable(不可退款的).","Guidelines for Visitors","The Garden is an active research facility and a living museum with a collection of over 8,000 plants.","Please bear in mind some simple rules for your visit:","Only trained working dogs are permitted to enter the Garden.","Children must stay with a grown-up at all times.","Stick strictly to the paths and lawns(草坪).","Do not climb the trees.","Please do not pick any part of a growing plant.","Cycling and ball games are not permitted in the Garden.","Guided Tours in the Garden","With over 8,000 plant species and a wonderful range of gardens and plantings to enjoy, there is something for everyone at the Garden, and many different aspects to appeal to a wide variety of interest groups.","◆Free Drop-in Weekend Tours","Enjoy a free-of-charge Garden tour with one of our expert guides, taking in the seasonal highlights of the Garden.","Our weekend tours are available every Sunday at 11:30 a.m. and 2 p.m. throughout the year. During the months of January and February these tours focus on the Winter Garden, Snowdrops and general winter interest.","The free tours last one hour and start from the Fountain, near the Main Lawn.","◆Group Tours","Our experienced volunteer guides will help you enjoy the highlights and provide some of the background history and development of this amazing garden.","These 90-minute, pre-bookable tours are ideal for adult groups wishing to make the most of their visit to our 40-acre site. Please visit the Group Guided Tours page for more details."],"passage_html":"\u003cp>Welcome to our university&#x27;s Botanic Garden—plan your visit, and find out about what we do!\u003c/p>\u003cp>You can either pay at the Ticket Office on arrival, or book your tickets online. Please note: Tickets cannot be used on any date other than the one they were booked for and are non-refundable(不可退款的).\u003c/p>\u003ch2 class=\"exam-heading\">Guidelines for Visitors\u003c/h2>\u003cp>The Garden is an active research facility and a living museum with a collection of over 8,000 plants.\u003c/p>\u003cp>Please bear in mind some simple rules for your visit:\u003c/p>\u003cp>Only trained working dogs are permitted to enter the Garden.\u003c/p>\u003cp>Children must stay with a grown-up at all times.\u003c/p>\u003cp>Stick strictly to the paths and lawns(草坪).\u003c/p>\u003cp>Do not climb the trees.\u003c/p>\u003cp>Please do not pick any part of a growing plant.\u003c/p>\u003cp>Cycling and ball games are not permitted in the Garden.\u003c/p>\u003ch2 class=\"exam-heading\">Guided Tours in the Garden\u003c/h2>\u003cp>With over 8,000 plant species and a wonderful range of gardens and plantings to enjoy, there is something for everyone at the Garden, and many different aspects to appeal to a wide variety of interest groups.\u003c/p>\u003ch3 class=\"exam-heading\">◆Free Drop-in Weekend Tours\u003c/h3>\u003cp>Enjoy a free-of-charge Garden tour with one of our expert guides, taking in the seasonal highlights of the Garden.\u003c/p>\u003cp>Our weekend tours are available every Sunday at 11:30 a.m. and 2 p.m. throughout the year. During the months of January and February these tours focus on the Winter Garden, Snowdrops and general winter interest.\u003c/p>\u003cp>The free tours last one hour and start from the Fountain, near the Main Lawn.\u003c/p>\u003ch3 class=\"exam-heading\">◆Group Tours\u003c/h3>\u003cp>Our experienced volunteer guides will help you enjoy the highlights and provide some of the background history and development of this amazing garden.\u003c/p>\u003cp>These 90-minute, pre-bookable tours are ideal for adult groups wishing to make the most of their visit to our 40-acre site. Please visit the Group Guided Tours page for more details.\u003c/p>","questions":[{"number":1,"prompt":"What should a potential visitor take note of before booking a ticket to the Garden?","options":["Whether one can afford the visit.","Whether the Garden website is accessible.","Whether one can accept the ticket-booking policy.","Whether the tickets are still available at the Ticket Office."],"answer":"C","analysis":"细节理解题。根据题干关键词take note of可定位在文章第二段的“Please note: Tickets cannot be used on any date other than the one they were booked for and are non-refundable.(请注意:门票仅可在预订的日期使用,且不可退款)”。由此可知,游客在订票前要先确认是否可以接受该订票政策。故选C。"},{"number":2,"prompt":"A kid is allowed to visit the Garden when they are _____ .","options":["well trained","with a bicycle","accompanied by an adult","guided by their working dog"],"answer":"C","analysis":"细节理解题。根据题干关键词A kid可定位在第一个小标题Guidelines for Visitors下的“Children must stay with a grown-up at all times.”。由此可知,孩子在参观过程中要有一名成年人陪伴。故选C。"},{"number":3,"prompt":"What behaviour is acceptable in the Garden?","options":["Picking a flower.","Climbing a tree.","Playing a ball game.","Walking on the lawns."],"answer":"D","analysis":"细节理解题。根据题干关键词behaviour is acceptable可定位至第一个小标题Guidelines for Visitors下的6条规定。由“Stick strictly to the paths and lawns.”可知,游客可以在草坪上走。故选D。"},{"number":4,"prompt":"Where do the free drop-in weekend tours start?","options":["Snowdrops.","The Fountain.","The Main Lawn.","The Winter Garden."],"answer":"B","analysis":"细节理解题。根据题干关键词free drop-in weekend tours start可定位在文章第八段“The free tours last one hour and start from the Fountain, near the Main Lawn.”。由此可知,游览从主草坪附近的喷泉开始。故选B。"},{"number":5,"prompt":"What special service can visitors enjoy on the group tour?","options":["The company of professional guides.","The explanation of how the Garden works.","The extended visit in and around the Garden.","The introduction to the birth and growth of the Garden."],"answer":"D","analysis":"细节理解题。根据第九段“Our experienced volunteer guides will...provide some of the background history and development of this amazing garden.”可知,导游会提供有关这座神奇植物园的历史背景和发展历程。the background history and development与D项中的the birth and growth相对应,故选D。"}],"external":{"id":"ext-119","title":"在秋天，有一种浪漫叫做“落叶不扫”","blocks":[{"english":"This Fall, Let's Stop Fighting the War on Leaves","chinese":"这个秋天，停止对落叶“宣战”吧"},{"english":"Every autumn, as leaves turn from green to auburn and float to the ground, we turn into a nation of outdoor undertakers. There will be raking, and pile-making, and paper sacks stuffed with leaves, arrayed along curbs like defensive bulwarks.","chinese":"每到秋天，当树叶由绿色变成红褐色，轻轻飘落在大地上，全国民众就会集体化身“户外殡葬师”。大家用耙子清扫落叶，再把叶子堆成一堆，然后将塞满落叶的纸袋整齐地排列在路边，宛如一道道防御堡垒。"},{"english":"I first encountered this strange ritual as a child, shortly after my family arrived in Connecticut from the Soviet Union in 1989. America's war on leaves made no sense to me then, and it makes no sense to me now.","chinese":"我第一次见识到这种奇特仪式的时候还是个孩子，那是在1989年，我刚随家人从苏联（the Soviet Union）搬家，来到了康涅狄格州（Connecticut）。彼时，美国的“落叶大战”在我看来毫无道理，如今依旧如此。"},{"english":"Healthy soil requires \"moisture and heat and warmth,\" says Annabel Renwick, a native plant curator at the Sarah P. Duke Gardens. Leaves provide all three, whether you leave them where they fall, scatter them in perennial beds or put them in a compost pile.","chinese":"莎拉·杜克花园（the Sarah P. Duke Gardens）的本土植物策展人安娜贝尔·伦尼克（Annabel Renwick）表示，健康的土壤需要“湿度、热能和温暖”，无论是让落叶留在原地，或是把它们撒到多年生植物的花坛里，还是把它们作为堆肥集中在一起，落叶都能为土壤提供所需的三种要素。"},{"english":"Why do so many of us spend money and effort sweeping all that fecundity away? \"I think it's habit,\" Renwick said. For many people, a lawn with leaves unblown or unraked offends their sensibilities. It suggests a household that lacks rules, or plays by rules other than the ones most of us have been inculcated with.","chinese":"为何我们中如此多人要费钱费力，就为了把这孕育生机的落叶一扫而净呢？“我觉得只是习惯使然。”伦尼克说。对许多人而言，看到草坪上有落叶没被吹扫或耙拢，就会让他们感到不舒服。它意味着这家人要么是没规矩，要么是遵守的规矩和大部分人被灌输的不一样。"},{"english":"I've come to think that inertia is among the most pernicious forces that can work on a society or an individual. We keep doing the same thing because the cost—emotional, cultural—of doing something new is simply too high. We sink into habits we never really meant to adopt, habits we know are not making us happy or healthy.","chinese":"我渐渐意识到，惯性是作用于社会或个人的最有害力量之一。我们持续采取同一种做法，只是因为无论在情感还是文化层面，采取一种新做法的代价都太高了。我们深陷其中的那些习惯，都是无意之间养成的，而我们也知道，这些习惯对于我们的幸福和健康都没有任何好处。"},{"english":"Whatever else leaves are, they are real. As they change color, wither and flame out, they remind us of the beauty of life, and of life's impermanence.","chinese":"无论落叶还象征着什么，它们都是真实的存在。从色彩渐变、枯萎到凋零，它们都在提醒着我们，去看到生命之美，去直面人生无常。"},{"english":"A drop of existential awareness may even make us a more humane society. After all, we too are leaves, facing inevitable autumn. A carpet of leaves teems with color and life, an ocean of reds and browns. Don't worry about the spiders. Dive right in.","chinese":"多一点存在主义的意识，甚至可能让我们的社会更有人情味。毕竟，我们每个人也都和树叶一样，终将面对生命中不可避免的“秋日”。一地落叶交织出斑斓色彩与蓬勃生机，宛如一片红褐相间的海洋。不要担心落叶里可能藏着蜘蛛，一头扎进去吧。"}],"level":"7"},"notes":{"background":"外刊从美国人每秋把落叶装袋的习惯说起。作者问，为什么大家要花钱费力清走这些落叶？她引述植物园工作人员的说法，把落叶视为能改善土壤环境的材料。文中列举原地保留、撒在花床上和堆肥三种处理方式。","expression":"leave them where they fall 里的 leave 是「让某物留在原处」。文章接着换用 scatter 和 put，具体写落叶被移到哪里。同一个 leave 在 leave the Garden 里才是「离开」。","sentence":{"english":"Leaves provide all three, whether you leave them where they fall, scatter them in perennial beds or put them in a compost pile.","parts":["Leaves provide all three,","whether you leave them where they fall,","scatter them in perennial beds","or put them in a compost pile."],"explanation":"主句说「落叶能提供这三点」，all three 要回到上一句找，说的是水分和保暖方面的条件。whether … or … 引出三种处理方式，意思是「不管采用哪一种」。scatter 和 put 共用从句的主语 you；where they fall 只交代第一种方式的地点，即落叶原来掉下来的地方。"},"vocabulary":[{"term":"bulwarks","meaning":"用于防御的屏障；作者把路边一排装满落叶的袋子比作防御工事。","context":"like defensive bulwarks"},{"term":"curator","meaning":"管理、研究特定馆藏或收藏的人；这里指负责植物园原生植物的人员。","context":"a native plant curator"},{"term":"perennial","meaning":"多年生的；perennial beds 是种植多年生植物的花床。","context":"in perennial beds"},{"term":"compost","meaning":"堆肥，由落叶等有机物分解而成；compost pile 指堆肥堆。","context":"a compost pile"},{"term":"fecundity","meaning":"丰饶、繁殖力；这里指落叶所蕴含、可回到土壤里的肥力与生机。","context":"sweeping all that fecundity away"},{"term":"inculcated","meaning":"通过长时间反复教导使人接受某种观念或习惯；文中说许多人从小形成了打理庭院的观念。","context":"the ones most of us have been inculcated with"},{"term":"inertia","meaning":"惯性；这里指即使旧做法不再合适，也不大愿意改变。","context":"inertia is among the most pernicious forces"},{"term":"impermanence","meaning":"无常、不能长久维持；作者从叶子变色、枯萎想到生命的变化。","context":"life's impermanence"}]}},{"id":"S-299953c881e1-P00053","date":"2026-11-23","year":2025,"session":"summer","letter":"B","source":"2025 天津高考英语第二次 · B 篇","title":"一座玩具小屋，留住母女说故事的时间","passage":["My great grandmother received the dollhouse(玩具小屋) from a family friend back in the late 1800s. It was then passed down from generation to generation. I was seven when I discovered it underneath the tree on Christmas morning.","In our house, Mom set up a sewing area. I sat at her sewing machine, my feet barely reaching the presser foot. Mom bent over me, her hands on mine, gently guiding small bits of cloth under the needle to create dollhouse bedding. She also taught me to make mini-blankets. With a little paint and glue, Mom demonstrated that anything could be turned into dollhouse furniture. I learnt to view the world as a place of possibility. I spent hours of my girlhood sitting before my dollhouse, telling made-up stories, and creating miniatures(缩微模型). But eventually school activities took over, and the dollhouse was moved to the attic(阁楼).","Over the next 40 years, the storytelling skills I'd practiced with the dollhouse grew into novel writing skills, and I developed a career as an author. One day, after hours of working on my fourth book, I took a break by surfing the Internet and happened to notice the beautiful dollhouses people posted on social media. They reminded me of mine. I went to the attic,brought it back to my room and started updating it.","During the mindless hours of sewing and furnishing(布置家具), I listened to audiobooks about the history of dollhouses, learning that they were not invented for play. There's a long, rich history of people in hardship turning to dollhouses to find comfort. They weren't produced as toys until mass production became standard after 1945. This inspired me to create a novel where art saves the day.","The truth was I myself needed art to save the day. Mom was then slipping away from me owing to progressive memory loss. The only topic we could discuss with any genuine joy was the update of the dollhouse. She loved retelling its history—those old memories. Mom didn't find it strange at all that her 50-year-old daughter was updating the dollhouse. She just thought it fun and beautiful. And it was. It was a world where Mom and I were at our best together."],"passage_html":"\u003cp>My great grandmother received the dollhouse(玩具小屋) from a family friend back in the late 1800s. It was then passed down from generation to generation. I was seven when I discovered it underneath the tree on Christmas morning.\u003c/p>\u003cp>In our house, Mom set up a sewing area. I sat at her sewing machine, my feet barely reaching the presser foot. Mom bent over me, her hands on mine, gently guiding small bits of cloth under the needle to create dollhouse bedding. She also taught me to make mini-blankets. With a little paint and glue, Mom demonstrated that anything could be turned into dollhouse furniture. I learnt to view the world as a place of possibility. I spent hours of my girlhood sitting before my dollhouse, telling made-up stories, and creating miniatures(缩微模型). But eventually school activities took over, and the dollhouse was moved to the attic(阁楼).\u003c/p>\u003cp>Over the next 40 years, the storytelling skills I&#x27;d practiced with the dollhouse grew into novel writing skills, and I developed a career as an author. One day, after hours of working on my fourth book, I took a break by surfing the Internet and happened to notice the beautiful dollhouses people posted on social media. They reminded me of mine. I went to the attic,brought it back to my room and started updating it.\u003c/p>\u003cp>During the mindless hours of sewing and furnishing(布置家具), I listened to audiobooks about the history of dollhouses, learning that they were not invented for play. There&#x27;s a long, rich history of people in hardship turning to dollhouses to find comfort. They weren&#x27;t produced as toys until mass production became standard after 1945. This inspired me to create a novel where art saves the day.\u003c/p>\u003cp>The truth was I myself needed art to save the day. Mom was then slipping away from me owing to progressive memory loss. The only topic we could discuss with any genuine joy was the update of the dollhouse. She loved retelling its history—those old memories. Mom didn&#x27;t find it strange at all that her 50-year-old daughter was updating the dollhouse. She just thought it fun and beautiful. And it was. It was a world where Mom and I were at our best together.\u003c/p>","questions":[{"number":1,"prompt":"What did the author's mother teach her to do?","options":["To sew and create miniatures.","To add imaginary figures to the dollhouse.","To make up fairy tales set in the dollhouse.","To do oil paintings and glue them onto the little walls."],"answer":"A","analysis":"细节理解题。根据第二段内容可知,作者的母亲教她制作玩具小屋的床上用品、迷你毯子,并用一些颜料和胶水,告诉作者任何东西都可以变成玩具小屋的家具。由此可知,作者的母亲教她缝纫并创作缩微模型。故选A。"},{"number":2,"prompt":"Why did the author decide to update the dollhouse decades later?","options":["She intended to follow the trend on social media.","She was eager to start a new career as a toy designer.","She felt the urge to compete with other dollhouse makers.","She was inspired by people sharing their dollhouses online."],"answer":"D","analysis":"细节理解题。根据第三段中notice the beautiful dollhouses people posted on social media和“They reminded me of mine.”可知,作者在网上看到人们发布的那些精美的玩具小屋照片,受到启发,想起了自己的玩具小屋。故选D。"},{"number":3,"prompt":"What did the author learn about dollhouses from the audiobooks?","options":["They were initially created for play.","People once sought comfort in them.","Rich people sold them for money during difficult times.","A uniform standard for their production was set in 1945."],"answer":"B","analysis":"细节理解题。根据第四段中people in hardship turning to dollhouses to find comfort可知,人们曾经在玩具小屋上寻求安慰。故选B。"},{"number":4,"prompt":"What role did the dollhouse play in strengthening the emotional ties between the author and her aging mother?","options":["A reminder of their childhood dreams.","A mirror of the eventful family history.","A tool to bring back good old memories.","A means to improve her mother's memory."],"answer":"C","analysis":"推理判断题。根据第五段内容可知,作者的母亲记忆逐渐衰退,母女二人唯一能带着真正的喜悦来讨论的话题就是玩具小屋。母亲喜欢讲述那些旧时记忆(those old memories)。由此可推断,玩具小屋是能唤起美好往昔记忆的工具,故选C。"},{"number":5,"prompt":"What would be the best title for the passage?","options":["The Dollhouse: A Lifelong Toy","Growing up with the Dollhouse","The Dollhouse: More Than Just a Toy","Dollhouse Making and Novel Writing"],"answer":"C","analysis":"主旨要义题。通过阅读全文可知,玩具小屋不仅是儿时玩具,也启发了作者的写作灵感,更是作者与母亲之间的情感纽带,故选C(玩具小屋:不只是一件玩具)。"}],"external":{"id":"ext-079","title":"人生下半场，如何好好照护父母，也不丢掉自己？","blocks":[{"english":"The Key to Caring for Aging Parents: Accept That You Can't Fix Everything","chinese":"照护年迈父母的关键：接受你无法让一切回到从前的现实"},{"english":"Most of us know, or will know, that being a caregiver is exhausting, demanding and often heartbreaking. The question is how can we take care of others when we are worn out?","chinese":"几乎所有人都清楚，或者说必将意识到这一点：照护他人这件事，让人苦不堪言、无比操心、而且还往往让人伤透了心。关键问题是：当我们已经精疲力竭时，如何还能照顾好别人？"},{"english":"It turns out that maintaining wellness as a caregiver, especially for older adults, doesn't follow the usual prescriptions of good diet, exercise and sleep, although all are important. Nor is it the absence of stress and sadness.","chinese":"事实证明，作为照护者（尤其是老年人群的照护者），保持自己的身心健康并不意味着遵循那些熟悉的专家建议，例如健康饮食、保持运动、保证睡眠，尽管上述这些都很重要。它也不意味着你完全没有压力，或者不会感到悲伤。"},{"english":"Instead, well-being often boils down to accepting that a loved one can't do things they once did, that their personalities can change and that anger, guilt and fear are normal. Rather than trying to do everything, we find that being present is often the most we can do.","chinese":"相反，身心健康的关键可以归结为接受现实——接纳你所爱的人无法再做到他们曾经能做的事，接纳他们的性格可能会改变，也接纳愤怒、内疚和恐惧的常态化。我们会明白与其努力做好一切，当下的陪伴往往才是我们能尽的最大努力。"},{"english":"One of the hardest things for caregivers to do is stop trying to change the immutable.","chinese":"对照护者而言，最难的事情之一，就是不再尝试去改变那些无力回天的事。"},{"english":"Tom Piech knows. His wife, Cheri, showed signs of early onset Alzheimer's in her 50s. At first, Piech, a retired pharmacist, cared for Cheri at home. She slept two hours a day, and followed him from room to room, worried, he believes, that she would lose him. When he began fearing for both their safety, he reluctantly moved her to a dementia-care facility.","chinese":"汤姆·皮奇（Tom Piech）对此深有体会。他的妻子谢莉（Cheri）在50多岁时出现了早发性阿尔茨海默病的迹象。起初，这位退休了的药剂师在家照顾妻子。那时谢莉每天只睡两个小时，无论皮奇去到哪个房间，她就会跟到那个房间。皮奇认为这是由于谢莉很怕自己会失去他。后来，他开始为两人的安全忧心忡忡。尽管内心很不情愿，皮奇还是把谢莉送进了失智症护理机构。"},{"english":"\"The transition from spouse to caregiver to caretaker is exquisitely difficult,\" he says. \"At the point of caretaker, you realize the person you loved for 50 years is gone.\" What sustained him was knowing he had done all he could with available resources and fleeting moments of clarity, including the time Cheri, who was then largely nonverbal, looked at him and said, \"You're a good man.\"","chinese":"“从配偶变成照护者，再变成看护人，这个转变极其艰难，”皮奇说，“你成为看护人的那一刻会明白，你爱了50年的那个人，已经不存在了。” 他之所以还能支撑着面对生活，是因为他知道，自己已经用尽了能用的资源，也认真对待了那些短暂的、谢莉还清醒的时刻。有一次，基本已经不能说话的谢莉看着他说：“你是个很好的人。”"},{"english":"\"Those are the words that you hold on to for a lifetime,\" says Piech, 74.","chinese":"74岁的皮奇说道：“这些话，你一辈子都会记在心里。”"}]},"notes":{"background":"外刊把陪伴和解决问题分开：接受亲人有些事已不能像从前那样做，仍可以留意她偶尔愿意说话的时刻。真题只说母亲 progressive memory loss，并未给出诊断，不能把外刊中的阿尔茨海默病套到母亲身上。","expression":"boil down to 表示「归根结底在于」。这里 to 是介词，后面接 accepting；三个 that 从句说的都是需要接受的情况。","sentence":{"english":"Instead, well-being often boils down to accepting that a loved one can't do things they once did, that their personalities can change and that anger, guilt and fear are normal.","parts":["Instead, well-being often boils down to accepting","that a loved one can't do things they once did,","that their personalities can change","and that anger, guilt and fear are normal."],"explanation":"主干是 well-being boils down to accepting …，三个 that 从句都是 accepting 的宾语，分别列出三件要接受的事。things they once did 中的 they once did 是省略了宾语关系词 that 的定语从句，修饰 things，意思是「他们以前做得到的事」。"},"vocabulary":[{"term":"prescriptions","meaning":"常规建议；后面列的是饮食、运动和睡眠，并非开药。","context":"the usual prescriptions of good diet, exercise and sleep"},{"term":"immutable","meaning":"无法改变的；the 加形容词，指照护者再努力也无法改变的事情。","context":"stop trying to change the immutable"},{"term":"onset","meaning":"起始、发病；early onset 指发病比通常年龄早。","context":"signs of early onset Alzheimer's"},{"term":"reluctantly","meaning":"心里不愿意、但还是做了；丈夫考虑到安全后才作出决定。","context":"he reluctantly moved her"},{"term":"dementia","meaning":"痴呆，涉及认知能力衰退的综合征；这里说照护此类患者的机构。","context":"a dementia-care facility"},{"term":"sustained","meaning":"支持某人继续撑下去；这里指心理上的支撑。","context":"What sustained him"},{"term":"fleeting","meaning":"一闪而过的；修饰妻子偶尔出现的短暂清醒时刻。","context":"fleeting moments of clarity"},{"term":"nonverbal","meaning":"不用语言表达的；形容这位妻子时，说的是她当时已很少开口。","context":"who was then largely nonverbal"}]}},{"id":"S-299953c881e1-P00089","date":"2026-11-24","year":2025,"session":"summer","letter":"C","source":"2025 天津高考英语第二次 · C 篇","title":"从海豹潜水到鲸鱼发声","passage":["All animals take in oxygen from the air they breathe in, and release CO2 from their blood when breathing out. Most mammals(哺乳动物) can't directly detect oxygen levels in the blood supplied to their tissues. Instead, they rely on the rising level of CO2 in their blood to signal that they might need to take a breath. But a recent study published in Science suggests seals(海豹) can sense the amount of oxygen in the blood, and change their diving behavior in response.","To find out if oxygen levels affected seal behavior, Professor McKnight at the University of St. Andrews and his colleagues created a special section in a pool where young seals were held. In one corner, there was a breathing chamber(呼吸室), where they were sheltered from the rain and the wind.","The breathing chamber was surrounded by panels that prevented surface swimming, yet swimming below the surface for about 200 feet would give the seals access to a feeder where they could eat as much fish as they liked. Once the seals got familiar with the setup, the researchers started to gradually change the composition of the air in the breathing chamber, increasing or reducing the levels of oxygen and CO2 to see an effect on their behavior. Sure enough: the higher the level of oxygen, the longer the seals stayed at the feeder.","The finding suggests that seals don't just physically respond to oxygen levels by changing their heart rate or breathing, but that they are sufficiently aware of them to change their behavior. This ability would put seals in a class beyond any land mammals that have been tested. Since oxygen levels on land remain stable, humans don't seem to have evolved(演化) to notice low blood oxygen levels, sometimes not even when they're about to pass out in free-diving.","Therefore, in free-diving without oxygen tanks, accidents are quite common. Our reliance on sensing CO2 levels in our blood instead of oxygen may be to blame. Actually, this is a perfectly reasonable strategy on land,where growing CO2 tends to signal breathing issues. But when holding our breath during diving, relying on CO2 levels is risky, especially on repeated dives. Because every time we surface and breathe in, our sensitivity to CO2 is decreased, even if its levels are already high, and this increases the chance that a person will, without awareness, pass out before they get to the surface."],"passage_html":"\u003cp>All animals take in oxygen from the air they breathe in, and release CO\u003csub>2\u003c/sub> from their blood when breathing out. Most mammals(哺乳动物) can&#x27;t directly detect oxygen levels in the blood supplied to their tissues. Instead, they rely on the rising level of CO\u003csub>2\u003c/sub> in their blood to signal that they might need to take a breath. But a recent study published in Science suggests seals(海豹) can sense the amount of oxygen in the blood, and change their diving behavior in response.\u003c/p>\u003cp>To find out if oxygen levels affected seal behavior, Professor McKnight at the University of St. Andrews and his colleagues created a special section in a pool where young seals were held. In one corner, there was a breathing chamber(呼吸室), where they were sheltered from the rain and the wind.\u003c/p>\u003cp>The breathing chamber was surrounded by panels that prevented surface swimming, yet swimming below the surface for about 200 feet would give the seals access to a feeder where they could eat as much fish as they liked. Once the seals got familiar with the setup, the researchers started to gradually change the composition of the air in the breathing chamber, increasing or reducing the levels of oxygen and CO\u003csub>2\u003c/sub> to see an effect on their behavior. Sure enough: the higher the level of oxygen, the longer the seals stayed at the feeder.\u003c/p>\u003cp>The finding suggests that seals don&#x27;t just physically respond to oxygen levels by changing their heart rate or breathing, but that they are sufficiently aware of them to change their behavior. This ability would put seals in a class beyond any land mammals that have been tested. Since oxygen levels on land remain stable, humans don&#x27;t seem to have evolved(演化) to notice low blood oxygen levels, sometimes not even when they&#x27;re about to pass out in free-diving.\u003c/p>\u003cp>Therefore, in free-diving without oxygen tanks, accidents are quite common. Our reliance on sensing CO\u003csub>2\u003c/sub> levels in our blood instead of oxygen may be to blame. Actually, this is a perfectly reasonable strategy on land,where growing CO\u003csub>2\u003c/sub> tends to signal breathing issues. But when holding our breath during diving, relying on CO\u003csub>2\u003c/sub> levels is risky, especially on repeated dives. Because every time we surface and breathe in, our sensitivity to CO\u003csub>2\u003c/sub> is decreased, even if its levels are already high, and this increases the chance that a person will, without awareness, pass out before they get to the surface.\u003c/p>","questions":[{"number":1,"prompt":"What do most mammals rely on to determine when to take a breath?","options":["The growing amount of CO2 in their blood.","The rising level of oxygen in their lungs.","The intensity of their physical activity.","The blood supply to body tissues."],"answer":"A","analysis":"细节理解题。根据第一段中“they rely on the rising level of CO2 in their blood to signal that they might need to take a breath”可知,哺乳动物依靠血液中二氧化碳含量的上升判断可能需要进行呼吸。故选A。"},{"number":2,"prompt":"When would the seals stay at the feeder for a longer period of time?","options":["When they needed to take in more food at the feeder.","When the oxygen level in the chamber grew higher.","When they familiarized themselves with the setup.","When the CO2 level in the chamber was raised."],"answer":"B","analysis":"推理判断题。根据第三段中“the higher the level of oxygen, the longer the seals stayed at the feeder”可推知,当呼吸室中氧气浓度升高时,海豹会在喂食器处停留更长的时间。故选B。"},{"number":3,"prompt":"What results in humans' inability to notice low oxygen levels in their blood?","options":["The unstable CO2 levels in the air.","Their lack of attention to breathing.","The constant oxygen levels on land.","Their functionally changeable heart rate."],"answer":"C","analysis":"推理判断题。根据第四段中“Since oxygen levels on land remain stable...”可推知,因为陆地上的氧气含量一直保持稳定,所以人们无法察觉血液中氧气含量降低这一情况。故选C。"},{"number":4,"prompt":"Why do accidents often occur when divers go free-diving?","options":["Their breath cannot be held long enough.","They cannot adjust the consumption of oxygen.","They may fail to notice rising CO2 levels soon enough.","Their breathing organs stop working properly underwater."],"answer":"C","analysis":"推理判断题。根据第五段内容,尤其是“Because every time we surface and breathe in, our sensitivity to CO2 is decreased”可知,人类主要依靠对血液中二氧化碳浓度的变化判断血氧水平,但潜水过程会使人类对二氧化碳浓度变化的感知力不断降低,因此人类在潜水过程中容易出现意外。故选C。"},{"number":5,"prompt":"Which statement is probably supported by McKnight's seal research?","options":["Seals have evolved to survive in low oxygen environments.","Seals are quick to sense oxygen levels and act accordingly.","Seals can maintain their heart rate even with low blood oxygen levels.","Seals are more sensitive to changes in the environment than other mammals."],"answer":"B","analysis":"主旨要义题。根据McKnight的实验发现可知,海豹并非只是通过改变心率或呼吸来对氧气含量做出生理反应,而是能够充分意识到氧气水平的变化,并据此调整自己的行为。故选B(海豹能够迅速感知氧气含量,并据此做出反应)。"}],"external":{"id":"ext-099","title":"准确率超 90%！AI 能翻译鲸鱼的语言了","blocks":[{"english":"I’m a Marine Biologist. This Is How I Talk to Whales.","chinese":"我是一名海洋生物学家。而这，就是我和鲸鱼对话的方式。"},{"english":"One afternoon in January 2024, off the island of Dominica in the Atlantic Ocean, a sperm whale named Pinchy and I drifted calmly at the surface of the water, examining each other.","chinese":"2024年1月的某天下午，在大西洋多米尼加岛（Dominica）附近的海域，一只名叫平奇（Pinchy）的抹香鲸和我平静地漂浮在海面上，彼此注视着。"},{"english":"After several minutes, Pinchy took a long breath, pointed her head downward and slowly began her descent into the ocean. Pinchy had a life that existed a mile underwater, while I lived in a metropolis where buildings stretched toward the sky. I wondered what Pinchy might tell me if I could understand what she was saying.","chinese":"几分钟后，平奇深吸了一口气，头朝下，缓缓向深海游去。平奇的生活在海面下一英里，而我则生活在摩天大楼直插云霄的大都市。我不禁好奇，如果我能听懂平奇的语言，它会告诉我些什么？"},{"english":"As a marine biologist studying how whales communicate, my dream is to one day answer that question. Several years ago, A.I. technologies began to demonstrate an ability to predict word patterns and formulate new sentences on their own. The whale biologist Shane Gero had an annotated sperm whale data set featuring thousands of codas. In a pilot study we ran, A.I. that was fed the data was able to accurately predict the type of coda, the whale’s vocal clan and the individual whale with over 90 percent accuracy.","chinese":"作为一名研究鲸鱼如何沟通交流的海洋生物学家，我的梦想是有朝一日能解答这个问题。几年前，人工智能技术开始展现出自主预测词语模式和生成新句子的能力。而鲸类生物学家谢恩･杰罗（Shane Gero）有一个标注过数千条抹香鲸尾声的数据集。在我们开展的试点研究中，喂入这些数据的人工智能，在预测尾音类型、鲸鱼所属的声音氏族，以及个体鲸鱼的身份中，准确率都超过了90%。"},{"english":"This gave rise to Project CETI (Cetacean Translation Initiative). Later this year we will release Whale Acoustics Model, a novel A.I. system that translates any audio into sperm whale vocalizations — allowing humans to potentially experience, for the first time, what it might be like to interact with a whale in its own language.","chinese":"而这让“鲸类翻译计划”（Project CETI）成为了可能。今年晚些时候，我们会发布一款叫“鲸鱼声学模型”（Whale Acoustics Model）的全新人工智能系统，它能把所有音频都翻译成抹香鲸的叫声——而这将使人类首次有机会体验到用鲸鱼的语言跟它互动会是一种什么样的感觉。"},{"english":"Used carelessly, A.I. could reinforce old hierarchies. It could accelerate ecological harm under the guise of progress. But if used with humility and care, A.I. can become a bridge that reconnects us to the natural world. To me, this is the real potential promise of A.I.: not to make us faster or more efficient, but to make us wiser.","chinese":"如果使用不当，人工智能很可能会加剧旧有的等级观念，它可能会打着“进步”的幌子加速对生态环境的破坏。但若能以谦逊审慎之心加以运用，人工智能便能成为一座桥梁，让我们重新和自然相连。在我看来，这才是人工智能真正的潜能所在——不是能让我们更快、更高效，而是能让我们离真正的智慧更近一步。"}]},"notes":{"background":"外刊报出的「超过 90%」是试验中对点击声类型、声音族群及个体的预测准确率。能从一段声音辨认是哪个族群或哪一头鲸，不等于知道鲸想表达什么。文章后面提出的互动是研究者的设想。","expression":"be fed the data 中的 feed 指把数据输给模型。改回主动就是 researchers fed the A.I. the data：模型接收数据，数据是送进去的材料。","sentence":{"english":"In a pilot study we ran, A.I. that was fed the data was able to accurately predict the type of coda, the whale’s vocal clan and the individual whale with over 90 percent accuracy.","parts":["In a pilot study we ran,","A.I. that was fed the data","was able to accurately predict","the type of coda, the whale’s vocal clan and the individual whale","with over 90 percent accuracy."],"explanation":"先找主干 A.I. was able to predict …。that was fed the data 修饰 A.I.，其中的 was 不是主句谓语。predict 后三个并列宾语说的是模型辨认了哪些信息；句尾的准确率限定的是这些预测，不能改说成翻译准确率。"},"vocabulary":[{"term":"descent","meaning":"下降、下潜；这里指鲸从水面向海中更深处游去。","context":"began her descent into the ocean"},{"term":"formulate","meaning":"组织、形成；接 new sentences，指按规律生成新的句子。","context":"formulate new sentences"},{"term":"annotated","meaning":"有标注的；数据已附上辨认声音用的信息，研究者才能用它训练和检验模型。","context":"an annotated sperm whale data set"},{"term":"coda","meaning":"在这篇文章里，指抹香鲸发出的一组有节奏的点击声。","context":"the type of coda"},{"term":"Acoustics","meaning":"声学；在模型名称中指对鲸的发声及录音的分析。","context":"Whale Acoustics Model"},{"term":"vocalizations","meaning":"动物发出的声音；这个词只描述发声，不预设每种声音都有可翻译的意思。","context":"sperm whale vocalizations"},{"term":"hierarchies","meaning":"等级结构；作者担心技术使用不当会加固既有的不平等关系。","context":"reinforce old hierarchies"},{"term":"guise","meaning":"表象、幌子；under the guise of progress 指表面说是进步，却可能造成其他伤害。","context":"under the guise of progress"}]}},{"id":"S-299953c881e1-P00126","date":"2026-11-25","year":2025,"session":"summer","letter":"D","source":"2025 天津高考英语第二次 · D 篇","title":"能做实验的猜想，和暂时无从验证的问题","passage":["Science serves as a powerful tool for unlocking the mysteries of the univer
